{% extends 'merchSite/index.html' %}
{% block title %}Profile - {{user}}{% endblock %}
{% block content %}
<div class="main">
    <h1>Review Products you have purchased.</h1>
    <ol>
    {% for product in delivered_products %}
        <li>
            {{product.product}}
            <a href="{% url 'add-review' product.id %}">Review It</a>
        </li>
          

    {% endfor %}
    </ol>
</div>

{%endblock %}
